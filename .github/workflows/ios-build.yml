name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ aidex ]

jobs:
  build:
    name: Build iAPS
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install CocoaPods dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      - name: Build and Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FreeAPS.xcodeproj \
            -scheme FreeAPS \
            -configuration Release \
            -archivePath $PWD/build/FreeAPS.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log || true
          echo "--- BUILD FINISHED ---"

      - name: Show real errors
        if: always()
        run: |
          echo "=== Строки с error: ==="
          grep -n "error:" xcodebuild.log | head -50 || echo "Не найдено"
          echo ""
          echo "=== Ошибки компилятора Swift (полный контекст) ==="
          grep -B 2 -A 15 "LiveActivityExtension.swift.*error\|error:.*LiveActivity" xcodebuild.log | head -100 || echo "Не найдено"
          echo ""
          echo "=== Секция failed commands ==="
          grep -A 30 "The following build commands failed" xcodebuild.log || echo "Не найдено"

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/FreeAPS.xcarchive/Products/Applications/FreeAPS.app Payload/
          zip -qr FreeAPS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FreeAPS-unsigned-ipa
          path: FreeAPS-unsigned.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7